<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Circular Image with Name</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <style>
    .circular-image {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      display: inline-block;
      margin-right: 20px;
      margin-bottom: 20px;
    }
    .circular-image img {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-4">
        <div class="circular-image">
          <img src="https://via.placeholder.com/150" alt="John Doe">
        </div>
        <span>John Doe</span>
      </div>
      <div class="col-md-4">
        <div class="circular-image">
          <img src="https://via.placeholder.com/150" alt="Jane Doe">
        </div>
        <span>Jane Doe</span>
      </div>
      <div class="col-md-4">
        <div class="circular-image">
          <img src="https://via.placeholder.com/150" alt="John Smith">
        </div>
        <span>John Smith</span>
      </div>
    </div>
  </div>
</body>
</html>
