<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .review-box {
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .user-review-box {
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <div class="row">
    <div class="col-md-6">
      <div class="review-box">
        <h3>Reviews</h3>
        <div class="review">
          <h5>John Doe</h5>
          <p>This is a great product!</p>
          <div class="stars" style="color: gold;">
            ★★★★★
          </div>
        </div>
        <div class="review">
          <h5>Jane Smith</h5>
          <p>Could be better.</p>
          <div class="stars" style="color: gold;">
            ★★★☆☆
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="user-review-box">
        <h3>Add Your Review</h3>
        <form>
          <div class="mb-3">
            <label for="userName" class="form-label">Name</label>
            <input type="text" class="form-control" id="userName" required>
          </div>
          <div class="mb-3">
            <label for="userRating" class="form-label">Rating</label>
            <select class="form-select" id="userRating" required>
              <option value="">Select...</option>
              <option value="5">★★★★★</option>
              <option value="4">★★★★☆</option>
              <option value="3">★★★☆☆</option>
              <option value="2">★★☆☆☆</option>
              <option value="1">★☆☆☆☆</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="userComment" class="form-label">Comment</label>
            <textarea class="form-control" id="userComment" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
